<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CanlıMüzik.fm — Canlı Müzik Yayını</title>
  <meta name="description" content="CanlıMüzik.fm - Canlı müzik yayın sayfası. Playlist, canlı chat ve hızlı yönetim için repo tabanlı ayarlar." />
  <style>
    :root{--bg:#071021;--card:#071621;--accent:#ffb703;--muted:#9fb3c8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#04121a 0%, #071021 60%);color:#eaf2f9;line-height:1.4}
    .wrap{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:18px}
    .logo{display:flex;align-items:center;gap:12px}
    .logo svg{width:48px;height:48px}
    h1{margin:0;font-size:26px;color:var(--accent);letter-spacing:.5px}
    p.lead{margin:2px 0 0;color:var(--muted)}

    .grid{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}
    .player-card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    .player{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
    iframe#player{position:absolute;inset:0;border:0;width:100%;height:100%}

    .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 6px}
    .now{font-weight:700}
    .controls{display:flex;gap:10px;align-items:center}
    .btn{background:var(--accent);color:#041324;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none}
    .muted{color:var(--muted);font-size:14px}

    /* sidebar */
    .sidebar{position:relative}
    .card{background:rgba(255,255,255,0.02);border-radius:10px;padding:12px}
    .playlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    .track{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;background:rgba(255,255,255,0.01);cursor:pointer}
    .track:hover{background:rgba(255,255,255,0.03)}
    .track .title{font-size:14px}
    .small{font-size:13px;color:var(--muted)}

    .chat-wrap{margin-top:12px}
    .chat-iframe{width:100%;height:400px;border-radius:8px;border:0}

    footer{margin-top:18px;color:#89a;font-size:13px}

    @media (max-width:980px){.grid{grid-template-columns:1fr;}.sidebar{order:2}} 
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <!-- simple SVG logo -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <circle cx="32" cy="32" r="30" fill="#ffb703" />
          <path d="M22 42V22l18 10-18 10z" fill="#041324"/>
        </svg>
      </div>
      <div>
        <h1>CanlıMüzik.fm</h1>
        <p class="lead">Anında canlı yayın — playlist ve canlı chat ile yayın yönetimi.</p>
      </div>
    </header>

    <div class="grid">
      <div>
        <section class="player-card" aria-live="polite">
          <div class="player" id="playerWrap">
            <!-- iframe / YouTube player burada -->
          </div>

          <div class="meta">
            <div>
              <div class="muted">Now playing</div>
              <div class="now" id="nowText">—</div>
            </div>
            <div class="controls">
              <button id="prevBtn" class="ghost">◀︎</button>
              <button id="playPauseBtn" class="btn">Play</button>
              <button id="nextBtn" class="ghost">▶︎</button>
              <select id="quality" class="ghost" style="padding:6px;border-radius:8px;background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04)">
                <option value="default">Kalite</option>
              </select>
            </div>
          </div>

          <div class="muted" id="note">Canlı chat için sağdaki "Show chat" düğmesini kullan.</div>
        </section>
      </div>

      <aside class="sidebar">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>Playlist</strong>
            <div>
              <button id="shuffleBtn" class="ghost">Shuffle</button>
              <button id="showChatBtn" class="btn">Show chat</button>
            </div>
          </div>

          <div class="playlist" id="playlist"></div>
          <div class="small" style="margin-top:8px">Repo'dan yönet: <a id="editLink" href="#">video.json / playlist.json</a></div>

          <div class="chat-wrap" id="chatWrap" style="display:none;margin-top:12px">
            <iframe id="chatIframe" class="chat-iframe" src="about:blank" title="YouTube Live Chat"></iframe>
          </div>
        </div>
      </aside>
    </div>

    <footer>
      <p>Repo: <a href="https://github.com/taha0093/canlimuzik-fm" style="color:var(--muted)">@taha0093/canlimuzik-fm</a></p>
    </footer>
  </div>

  <script>
    // Basic player + playlist + YouTube IFrame API integration
    const defaultVideo = null; // if no config, use playlist first item
    let playlist = [];
    let currentIndex = 0;
    let player = null;
    let isPlaying = false;

    const OWNER = 'taha0093';
    const REPO = 'canlimuzik-fm';
    document.getElementById('editLink').href = `https://github.com/${OWNER}/${REPO}/edit/main/playlist.json`;

    // load config (video.json) and playlist.json
    async function loadConfig(){
      try{
        const [cfgRes, plRes] = await Promise.all([
          fetch('video.json', {cache:'no-store'}),
          fetch('playlist.json', {cache:'no-store'}).catch(()=>null)
        ]);

        let cfg = null;
        if (cfgRes && cfgRes.ok) cfg = await cfgRes.json();
        let pl = null;
        if (plRes && plRes.ok) pl = await plRes.json();

        if (pl && Array.isArray(pl)) playlist = pl;
        else playlist = playlist || [];

        if (cfg && cfg.provider && cfg.id){
          // Put the single config id at front of playlist (if not present)
          const id = cfg.id;
          playlist = [{id:id,title:`Live: ${id}`}].concat(playlist.filter(t=>t.id!==id));
        }

        if (playlist.length===0 && defaultVideo) playlist = [{id: defaultVideo, title: defaultVideo}];

      }catch(e){console.log('config load error',e)}
    }

    function renderPlaylist(){
      const box = document.getElementById('playlist');
      box.innerHTML = '';
      playlist.forEach((t,i)=>{
        const el = document.createElement('div');
        el.className = 'track';
        el.innerHTML = `<div><div class="title">${escapeHtml(t.title||t.id)}</div><div class="small">${t.id}</div></div><div class="small">${i===currentIndex? '◉' : ''}</div>`;
        el.onclick = ()=>{ playIndex(i); };
        box.appendChild(el);
      });
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function loadYouTubeAPI(){
      return new Promise((resolve)=>{
        if (window.YT && window.YT.Player) return resolve();
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
        window.onYouTubeIframeAPIReady = ()=>resolve();
      });
    }

    async function initPlayer(){
      await loadYouTubeAPI();
      const startId = playlist[0] ? playlist[0].id : '';
      player = new YT.Player('playerWrap', {
        height: '360',
        width: '640',
        videoId: startId,
        playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: (e)=>{
            updateUI();
          },
          onStateChange: (e)=>{
            if (e.data === YT.PlayerState.ENDED){
              // play next
              playNext();
            } else if (e.data === YT.PlayerState.PLAYING){ isPlaying=true; updatePlayButton(); }
            else if (e.data === YT.PlayerState.PAUSED){ isPlaying=false; updatePlayButton(); }
          }
        }
      });
    }

    function updateUI(){
      document.getElementById('nowText').textContent = playlist[currentIndex] ? (playlist[currentIndex].title || playlist[currentIndex].id) : '—';
      renderPlaylist();
      updatePlayButton();
    }

    function playIndex(i){
      if (!playlist[i]) return;
      currentIndex = i;
      const id = playlist[i].id;
      if (player && player.loadVideoById){ player.loadVideoById(id); }
      updateUI();
    }

    function playNext(){
      if (currentIndex < playlist.length-1) currentIndex++; else currentIndex = 0;
      playIndex(currentIndex);
    }
    function playPrev(){
      if (currentIndex > 0) currentIndex--; else currentIndex = playlist.length-1;
      playIndex(currentIndex);
    }

    function togglePlay(){
      if (!player) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
    }

    function updatePlayButton(){
      const btn = document.getElementById('playPauseBtn');
      btn.textContent = isPlaying ? 'Pause' : 'Play';
    }

    // chat handling
    function toggleChat(){
      const wrap = document.getElementById('chatWrap');
      const iframe = document.getElementById('chatIframe');
      if (wrap.style.display === 'none' || wrap.style.display === ''){
        // show chat for current video
        const id = playlist[currentIndex] ? playlist[currentIndex].id : (new URLSearchParams(location.search).get('v') || '');
        const domain = location.hostname;
        iframe.src = `https://www.youtube.com/live_chat?v=${encodeURIComponent(id)}&embed_domain=${encodeURIComponent(domain)}`;
        wrap.style.display = 'block';
        document.getElementById('showChatBtn').textContent = 'Hide chat';
      } else { wrap.style.display = 'none'; iframe.src='about:blank'; document.getElementById('showChatBtn').textContent='Show chat'; }
    }

    // shuffle
    function shufflePlaylist(){
      for(let i=playlist.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[playlist[i],playlist[j]]=[playlist[j],playlist[i]]}
      currentIndex=0;renderPlaylist();playIndex(0);
    }

    // attach UI
    document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
    document.getElementById('nextBtn').addEventListener('click', playNext);
    document.getElementById('prevBtn').addEventListener('click', playPrev);
    document.getElementById('showChatBtn').addEventListener('click', toggleChat);
    document.getElementById('shuffleBtn').addEventListener('click', shufflePlaylist);

    // main flow
    (async ()=>{
      await loadConfig();
      if (playlist.length===0){ document.getElementById('playerWrap').innerHTML='<div style="padding:28px;color:#bbb;text-align:center">Playlist boş — repo/playlist.json ekleyin veya video.json ile ID girin.</div>'; return; }
      renderPlaylist();
      await initPlayer();
      // if query param v is present, play it
      const q = new URLSearchParams(location.search).get('v');
      if (q){
        const idx = playlist.findIndex(t=>t.id===q);
        if (idx>=0) currentIndex=idx; else { playlist.unshift({id:q,title:`Ad-hoc: ${q}`}); currentIndex=0; }
        playIndex(currentIndex);
      }
    })();
  </script>
</body>
</html>
