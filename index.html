<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CanlıMüzik.fm — Canlı Müzik Yayını</title>
  <style>
    :root{--bg:#071021;--card:#071621;--accent:#ffb703;--muted:#9fb3c8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:#eaf2f9;line-height:1.4}
    .wrap{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;align-items:center;gap:20px}
    h1{margin:0;font-size:34px;color:var(--accent);letter-spacing:.5px}
    p.lead{margin:6px 0 0;color:var(--muted)}
    .player-card{margin-top:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
    .player{position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden}
    iframe#player{position:absolute;inset:0;border:0;width:100%;height:100%}
    .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 6px}
    .now{font-weight:700}
    .controls{display:flex;gap:10px;align-items:center}
    .btn{background:var(--accent);color:#041324;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none}
    .muted{color:var(--muted);font-size:14px}
    footer{margin-top:20px;color:#89a;font-size:13px}
    @media (max-width:640px){
      h1{font-size:24px}
      .meta{flex-direction:column;align-items:flex-start;gap:8px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CanlıMüzik.fm</h1>
      <div>
        <p class="lead">Anında canlı yayın — yayın kaynağını repo'dan değiştir.</p>
        <p class="muted" id="status">Yükleniyor…</p>
      </div>
    </header>

    <section class="player-card" aria-live="polite">
      <div class="player" id="playerWrap">
        <!-- iframe eklenecek -->
      </div>

      <div class="meta">
        <div>
          <div class="muted">Now playing</div>
          <div class="now" id="nowText">—</div>
        </div>
        <div class="controls">
          <a id="editBtn" class="ghost" target="_blank" rel="noopener">Repo'da yayını değiştir</a>
          <a id="previewHelp" class="muted">Önizleme: <code>?v=VIDEO_ID</code></a>
        </div>
      </div>
      <div class="muted" id="note">Bu sayfa gömme oynatıcıdır — yayın YouTube/Twitch tarafından sağlanır.</div>
    </section>

    <footer>
      <p>Repo: <a href="https://github.com/taha0093/canlimuzik-fm" style="color:var(--muted)">@taha0093/canlimuzik-fm</a> • Tasarım: CanlıMüzik.fm</p>
    </footer>
  </div>

  <script>
    (async () => {
      const OWNER = 'taha0093';
      const REPO = 'canlimuzik-fm';
      const params = new URLSearchParams(location.search);
      const overrideId = params.get('v');
      const overrideProvider = (params.get('provider')||'').toLowerCase();

      document.getElementById('editBtn').href = `https://github.com/${OWNER}/${REPO}/edit/main/video.json`;

      async function fetchConfig() {
        try {
          const res = await fetch('video.json', {cache:'no-store'});
          if (!res.ok) return null;
          return await res.json();
        } catch(e){ return null; }
      }

      const cfg = await fetchConfig();
      let provider = cfg && cfg.provider ? cfg.provider.toLowerCase() : null;
      let id = cfg && cfg.id ? cfg.id : null;

      if (overrideId) { id = overrideId; if (overrideProvider) provider = overrideProvider; }
      if (!provider && id) provider = 'youtube';

      const playerWrap = document.getElementById('playerWrap');
      const nowText = document.getElementById('nowText');
      const status = document.getElementById('status');
      const note = document.getElementById('note');

      if (!provider || !id) {
        status.textContent = 'Yayın yapılandırılmamış';
        playerWrap.innerHTML = '<div style="padding:28px;color:#bbb;text-align:center">Yayın yok — repo/video.json dosyasını düzenleyin veya <code>?v=VIDEO_ID</code> ile önizleyin.</div>';
        nowText.textContent='—';
        return;
      }

      status.textContent = `${provider.toUpperCase()} • ${id}`;
      nowText.textContent = `${provider.toUpperCase()} • ${id}`;

      if (provider === 'youtube') {
        const src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&modestbranding=1`;
        playerWrap.innerHTML = `<iframe id="player" src="${src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } else if (provider === 'twitch') {
        const parent = location.hostname;
        const src = `https://player.twitch.tv/?channel=${encodeURIComponent(id)}&parent=${parent}&autoplay=true`;
        playerWrap.innerHTML = `<iframe id="player" src="${src}" allowfullscreen frameborder="0" scrolling="no"></iframe>`;
      } else {
        playerWrap.innerHTML = '<div style="padding:28px;color:#bbb;text-align:center">Desteklenmeyen provider.</div>';
      }

    })();
  </script>
</body>
</html>
